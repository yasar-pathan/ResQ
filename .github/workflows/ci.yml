name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        run: cp .env.example .env

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Wait for API health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then
              exit 0
            fi
            sleep 5
          done
          echo "API health check failed"
          docker compose logs
          exit 1

      - name: Wait for worker health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8081/health; then
              exit 0
            fi
            sleep 5
          done
          echo "Worker health check failed"
          docker compose logs worker
          exit 1

      - name: Apply database migrations
        run: docker compose run --rm migrate

      - name: Seed dev data smoke
        run: docker compose run --rm api python -m app.scripts.seed_dev

      - name: Backend smoke tests
        run: docker compose run --rm api pytest

      - name: Frontend lint
        run: docker compose run --rm frontend sh -c "npm ci && npm run lint"

      - name: Frontend unit tests
        run: docker compose run --rm frontend sh -c "npm ci && npm test"

      - name: Frontend production build
        run: docker compose run --rm frontend sh -c "npm ci && npm run build"

      - name: Dependency audits
        run: |
          docker compose run --rm api sh -c "pip install --quiet pip-audit==2.7.3 && pip-audit -r requirements.txt || true"
          docker compose run --rm frontend sh -c "npm ci && npm audit --audit-level=high || true"

      - name: Tear down
        if: always()
        run: docker compose down -v

  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff check
        run: |
          pip install ruff==0.8.4
          ruff check app tests

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: ESLint
        working-directory: frontend
        run: |
          npm ci
          npm run lint
