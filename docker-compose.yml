name: rescuegrid

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rescuegrid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rescuegrid}
      POSTGRES_DB: ${POSTGRES_DB:-rescuegrid}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rescuegrid
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-rescuegrid} -d ${POSTGRES_DB:-rescuegrid}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    networks:
      - rescuegrid
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"

  # Optional connection pooler: docker compose --profile pooler up -d
  pgbouncer:
    image: edoburu/pgbouncer:latest
    profiles: ["pooler"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-rescuegrid}:${POSTGRES_PASSWORD:-rescuegrid}@postgres:5432/${POSTGRES_DB:-rescuegrid}
      AUTH_TYPE: plain
      POOL_MODE: session
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rescuegrid
    ports:
      - "6432:5432"
    healthcheck:
      test: ["CMD-SHELL", "hostname"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rescuegrid
    restart: "no"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - rescuegrid
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Second API replica: docker compose --profile replicas up -d
  api2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    profiles: ["replicas"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - rescuegrid
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    command: ["/app/docker/worker-entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - rescuegrid
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
    networks:
      - rescuegrid
    ports:
      - "3000:3000"
    volumes:
      # Live source so UX edits apply without image rebuild
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      # Linux-native build cache (do not use host .next)
      - frontend_next:/app/.next

networks:
  rescuegrid:
    name: rescuegrid

volumes:
  postgres_data:
  frontend_node_modules:
  frontend_next:
